<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>晶獸紀元</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one handheld-console column — screen on top, controls below. Single dark arcade look by choice. */
:root{
  --bg:#0b0e1a; --panel:#121834; --panel2:#0d1228; --edge:#2a3366; --cyan:#5ff3ff; --pink:#ff5fa2; --gold:#ffd166;
  --ink:#e9ecff; --muted:#8a93c2; --good:#7ee08a;
  --font:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;touch-action:manipulation}
/* Phone portrait 9:16 device: game 7 parts on top, buttons 2 parts below */
.device{margin:0 auto;aspect-ratio:9/16;height:min(calc(100vh - 32px),calc((100vw - 32px)*16/9));height:min(calc(100dvh - 32px),calc((100vw - 32px)*16/9));max-width:100%;display:grid;grid-template-rows:7fr 2fr;background:#10152e;border:2px solid var(--edge);border-radius:14px;overflow:hidden;container-type:size;user-select:none;-webkit-user-select:none}
.screen{position:relative;min-height:0;background:#000;border-bottom:3px solid var(--edge);container-type:inline-size;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;object-fit:fill;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:3%;top:2%;background:rgba(10,14,32,.82);border:2px solid var(--edge);padding:.3em .6em;font-size:clamp(10px,3.4cqw,14px);line-height:1.4;max-width:62%}
.hud b{color:var(--pink);font-weight:400;margin-right:.5em;letter-spacing:.08em}
.hint{position:absolute;right:3%;top:2%;font-size:clamp(9px,2.8cqw,12px);color:var(--muted);background:rgba(10,14,32,.7);padding:.25em .6em;border:1px solid var(--edge)}
#toastHost{position:absolute;z-index:5;left:0;right:0;top:15%;display:flex;flex-direction:column;align-items:center;gap:.4em;pointer-events:none}
.toast{background:var(--panel);border:3px solid var(--pink);padding:.45em 1em;text-align:center;font-size:clamp(11px,4cqw,16px);box-shadow:0 0 14px rgba(255,95,162,.4);animation:pop 2.8s steps(8) forwards;max-width:88%}
.toast.gold{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.35)}
.toast small{display:block;color:var(--pink);font-size:.75em;letter-spacing:.2em}
.toast.gold small{color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:translateY(-6px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.dlg{position:absolute;left:3%;right:3%;bottom:2.5%;min-height:5.2em;background:rgba(10,14,32,.95);border:3px solid var(--cyan);box-shadow:inset 0 0 0 2px #0b0e1a,0 0 12px rgba(95,243,255,.3);padding:.9em 1em .8em;font-size:clamp(12px,4.4cqw,18px);line-height:1.65;cursor:pointer}
.dlg .nm{position:absolute;top:-1.15em;left:.8em;background:var(--pink);color:#1a0b18;padding:0 .6em;font-size:.85em;line-height:1.7;border:2px solid #0b0e1a}
.dlg.narr{color:#c9d0f2}
.dlg .nx{position:absolute;right:.8em;bottom:.3em;color:var(--cyan);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
[hidden]{display:none!important}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;text-align:center;padding:1em;font-size:clamp(12px,4.2cqw,18px)}
.title{background:linear-gradient(180deg,rgba(11,14,26,.5),rgba(11,14,26,.94));overflow:auto;justify-content:safe center}
.tpanel{display:flex;flex-direction:column;align-items:center;gap:.8em;width:100%}
.tbtns{display:flex;flex-direction:column;gap:.7em;width:min(13em,100%)}
.tbtns .btn{width:100%;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.title .code{width:min(28em,100%);text-align:left}
.title .box{width:min(28em,100%);text-align:left}
.tmsg{color:var(--gold);min-height:1.3em;font-size:.85em}
.title h1{margin:0;font-weight:400;font-size:clamp(30px,14cqw,60px);letter-spacing:.14em;color:#f4f6ff;text-shadow:3px 3px 0 var(--pink),-3px -3px 0 #2b6c8f}
.title .en{color:var(--cyan);letter-spacing:.4em;font-size:.8em}
.title .row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;justify-content:center}
.title label{color:var(--muted)}
.title input{font:inherit;width:7em;background:#0b0e1a;color:var(--ink);border:2px solid var(--edge);padding:.25em .5em;text-align:center}
.title input:focus{outline:none;border-color:var(--cyan)}
.btn{font:inherit;background:var(--pink);color:#1a0b18;border:3px solid #0b0e1a;box-shadow:0 0 0 2px var(--pink);padding:.35em 1.1em;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 0 0 2px var(--cyan)}
.menu .btn.alt{background:#ffffff!important;color:#383848!important;border-color:#485878!important;box-shadow:0 0 0 2px #c8d0e0!important}
.btn:focus-visible,.controls button:focus-visible,.menu button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{background:#05060e}
.card h2{margin:0;font-weight:400;font-size:clamp(24px,10cqw,44px);letter-spacing:.3em}
.card p{margin:0;color:var(--cyan)}
.card small{color:var(--muted)}

/* ----- quick menu ----- */
.menu{position:absolute;inset:0;background:rgba(6,8,18,.92);display:grid;grid-template-rows:auto minmax(0,1fr);gap:.5em;padding:3%;font-size:clamp(10px,3.6cqw,14px);line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;min-width:0}
.menu button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.tab{display:flex;flex-direction:column;align-items:center;background:var(--panel2)!important;border:2px solid var(--edge)!important;padding:.25em 0!important;text-align:center!important;white-space:nowrap}
.tab .n{color:var(--muted);font-size:.7em;line-height:1}
.tab.on{border-color:var(--cyan)!important;background:#16204a!important}
.tab.on.f{box-shadow:inset 0 -3px 0 var(--cyan)}
.pane{position:relative;background:var(--panel2);border:2px solid var(--edge);padding:.7em .8em;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:.6em}
.pane.f{border-color:var(--cyan)}
.pane h3{margin:0;font-weight:400;font-size:1.1em;display:flex;justify-content:space-between;gap:.5em;align-items:baseline}
.pane h3 small{color:var(--muted);font-size:.75em}
.pane h3{padding-right:1.6em}
.x{position:absolute;right:.5em;top:.35em;color:var(--muted)!important;font-size:1.1em}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6em}
@container (max-width:440px){.cols{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:.25em;margin:0;padding:0;list-style:none}
.it{display:flex;align-items:center;gap:.5em;width:100%;border:2px solid transparent!important;padding:.2em .4em!important;background:#0a0f22!important}
.it.on{border-color:var(--pink)!important;background:#2a1430!important}
.it .lab{color:var(--muted);width:2.6em;flex:none}
.none{color:#59608a}
.ico{width:1.5em;height:1.5em;image-rendering:pixelated;flex:none}
.box{border:1px solid var(--edge);background:#0a0f22;padding:.5em .6em;display:flex;flex-direction:column;gap:.25em}
.box .k{color:var(--muted)}
.stat{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.stat .up{color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.btabs{display:flex;gap:.35em;margin-bottom:.4em}.menu .btab{flex:1;font:inherit;padding:.25em 0!important;border:2px solid #485878!important;border-radius:6px!important;background:#f8f8f8!important;color:#383848!important;cursor:pointer;text-align:center!important;justify-content:center}.btab small{color:#8890a8}.menu .btab.sel{background:#d8e8ff!important;font-weight:700}.menu .btab.on{border-color:#e04848!important;box-shadow:0 0 0 2px #e04848!important}
.bagcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.6em;align-items:start}.bagcols .box{position:sticky;top:0}
@container (max-width:440px){.bagcols .grid{grid-template-columns:repeat(6,minmax(0,1fr))}.bagcols{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.cell{aspect-ratio:1;max-width:100%;background:#0a0f22!important;border:1px solid #232b55!important;display:flex!important;align-items:center;justify-content:center;position:relative}
.cell .ico{width:72%;height:72%}
.cell .c{position:absolute;right:1px;bottom:0;font-size:.7em;color:var(--gold)}
.cell.on{border:2px solid var(--pink)!important}
.msg{color:var(--gold);min-height:1.4em}
.act{display:flex;gap:.5em;flex-wrap:wrap}
.act .btn{font-size:.9em;padding:.15em .8em}
.redeem{display:flex;gap:.4em}.redeem input{flex:1;min-width:0;font:inherit;padding:.25em .5em;border:2px solid #485878;border-radius:4px;background:#fff;color:#383848;text-transform:uppercase}.redeem .btn{font-size:.9em;padding:.15em .8em}
.chip{font-size:.75em;padding:0 .5em;border:1px solid currentColor;flex:none}
.chip.done{color:var(--good)}.chip.go{color:var(--gold)}
.bar{height:.5em;background:#232b55;flex:1;min-width:2em}.bar i{display:block;height:100%;background:var(--cyan)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15em}
.steps li::before{content:"□ ";color:var(--muted)}
.steps li.ok{color:var(--muted)}.steps li.ok::before{content:"■ ";color:var(--good)}
.steps li.cur{color:var(--ink)}.steps li.cur::before{content:"▶ ";color:var(--pink)}
.mapwrap{position:relative;align-self:flex-start;width:100%;max-width:100%}
.wmwrap canvas{display:block;width:100%;border:1px solid #c8b888;border-radius:4px}
.mapwrap canvas{display:block;width:100%;image-rendering:pixelated;border:1px solid var(--edge)}
.mk{position:absolute;width:3%;aspect-ratio:1;max-width:100%;background:var(--pink);box-shadow:0 0 0 2px #fff;transform:translate(-50%,-50%);animation:blink .8s steps(2) infinite}
.ml{position:absolute;transform:translate(-50%,-50%);font-size:.72em;background:rgba(10,14,32,.8);padding:0 .3em;white-space:nowrap;pointer-events:none}
.dexhero{display:flex;gap:.7em;align-items:flex-start}
.dexhero .big{width:5.2em;height:5.2em;flex:none;image-rendering:pixelated;background:#ffffff;border:1px solid #c8d0e0;border-radius:4px}
.dexhero .info{display:flex;flex-direction:column;gap:.2em;min-width:0}
.sys{font-size:.75em;padding:0 .45em;border:1px solid currentColor;margin-right:.25em;white-space:nowrap}
.sys.e{color:#ff9a5a}.sys.p{color:#c9a7ff}.sys.m{color:#9fb4e0}.sys.x{color:var(--gold)}
.star{color:var(--gold);letter-spacing:.05em}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 2.2em;gap:.15em .5em;align-items:center;font-variant-numeric:tabular-nums}
.bars i{display:block;height:.45em;background:#232b55}.bars i b{display:block;height:100%;background:var(--cyan)}
.evo{display:flex;flex-direction:column;gap:.25em;border-top:1px dashed var(--edge);padding-top:.4em;margin-top:.2em}
.route{font-size:.8em;letter-spacing:.1em}
.evline{display:flex;flex-wrap:wrap;align-items:center;gap:.3em}
.evs{display:inline-flex;flex-direction:column;gap:.1em;background:#ffffff;padding:.2em .45em;border:1px solid #232b55;min-width:0}
.evs small{color:var(--muted);font-size:.75em}
.evs .sys{align-self:flex-start}
.arw{color:var(--cyan)}
.dexgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.dexcell{aspect-ratio:1;max-width:100%;background:#ffffff!important;border:1px solid #232b55!important;display:flex!important;align-items:center;justify-content:center;position:relative;padding:0!important}
.dexcell img{width:86%;height:86%;image-rendering:pixelated}
.dexcell .no{position:absolute;left:1px;top:0;font-size:.55em;color:var(--muted)}
.dexcell.on{border:2px solid var(--pink)!important}
.dexcell.unseen img{filter:brightness(.35) saturate(.3)}
.dexcell.hid img{filter:brightness(0) opacity(.6)}
.battle{position:absolute;inset:0;font-size:clamp(10px,3.3cqw,15px);line-height:1.4}
.bhud{position:absolute;background:rgba(10,14,32,.88);border:2px solid var(--edge);padding:.3em .6em;display:flex;flex-direction:column;gap:.35em;min-width:0}
.bhud.enemy{left:2%;top:3%;width:min(45%,15em);box-sizing:border-box}
.bhud.ally{right:2%;top:3%;width:min(45%,16em);box-sizing:border-box}
.bu{display:flex;flex-direction:column;gap:.15em}
.bu .nm{display:flex;justify-content:space-between;gap:.4em;white-space:nowrap}
.bnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8em}
.hpb{height:.42em;background:#232b55;position:relative;overflow:hidden}.hpb i{position:absolute;left:0;top:0;bottom:0;background:var(--good);transition:width .3s steps(6)}
.hpb.low i{background:var(--gold)}.hpb.crit i{background:#ff4d6d}.hpb.mpb{height:.28em}.hpb.mpb i{background:var(--cyan)}
.bko{opacity:.45}
.bbox{position:absolute;left:2%;right:2%;bottom:2%;height:31%;background:rgba(10,14,32,.96);border:3px solid var(--cyan);padding:.45em .7em;display:flex;flex-direction:column;gap:.4em;overflow:auto}
.blog{min-height:1.4em}
.bcmd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3em}
.bcmd.one{grid-template-columns:minmax(0,1fr)}
.bo{font:inherit;color:var(--ink);background:#141a38;border:2px solid #232b55;padding:.2em .5em;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:.5em;min-width:0}
.bo.on{border-color:var(--pink);background:#2a1430}
.bo:disabled{opacity:.4;cursor:not-allowed}
.bo small{color:var(--muted);white-space:nowrap}
.evotext{position:absolute;left:4%;right:4%;bottom:5%;background:rgba(10,14,32,.92);border:3px solid var(--gold);padding:.6em .9em;text-align:center;font-size:clamp(12px,4cqw,18px);line-height:1.5}
.evs.pv{cursor:pointer}.evs.pv:hover{border-color:var(--cyan)}
.evs img{width:2.6em;height:2.6em;image-rendering:pixelated;align-self:center}
.code{width:100%;max-width:100%;box-sizing:border-box;font:inherit;font-size:.82em;line-height:1.35;background:#05070f;color:var(--ink);border:1px solid var(--edge);padding:.4em;word-break:break-all;resize:vertical}
.code:focus{outline:none;border-color:var(--cyan)}
.jobsel{background:rgba(5,6,14,.9);overflow:auto;justify-content:safe center;z-index:4}
.jw{display:flex;flex-direction:column;gap:.7em;align-items:center;width:min(36em,100%)}
.jt{margin:0;color:var(--ink);letter-spacing:.15em;font-size:1.1em}
.jd{margin:0;color:var(--muted);font-size:.85em;line-height:1.6;max-width:30em}
.jlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em;width:100%}
@container (max-width:440px){.jlist{grid-template-columns:minmax(0,1fr)}}
.jc{font:inherit;color:var(--ink);text-align:left;background:var(--panel);border:2px solid var(--edge);padding:.5em .7em;display:flex;flex-direction:column;align-items:flex-start;gap:.3em;cursor:pointer}
.jc.on{border-color:var(--pink);box-shadow:0 0 12px rgba(255,95,162,.35)}
.jc b{font-weight:400;font-size:1.05em;color:var(--pink);letter-spacing:.1em}
.jc small{color:var(--muted);font-size:.78em;line-height:1.5}
.btn.on{outline:2px solid var(--cyan);outline-offset:2px}
.slot6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4em}
.slot6 .it{justify-content:center;min-height:2.6em;color:#59608a}

/* ----- controls ----- */
.controls{min-height:0;display:flex;justify-content:space-between;align-items:center;padding:0 5cqw;touch-action:none;background:linear-gradient(#141a38,#0e1229)}
.keys{display:none;color:var(--muted);font-size:12.5px;line-height:1.9;text-align:center;margin-top:12px}
body.pc .keys{display:block}
@media (hover:hover) and (pointer:fine){body.mobile .keys{display:block}}
/* PC: 16:9 landscape screen, keyboard play, no on-screen pad */
body.pc .device{aspect-ratio:16/9;height:auto;width:min(100%,calc((100vh - 110px)*16/9));width:min(100%,calc((100dvh - 110px)*16/9));grid-template-rows:minmax(0,1fr);border-radius:8px;container-type:normal}
body.pc .controls{display:none}
body.pc .screen{border-bottom:0}
.linkbtn{font:inherit;font-size:.8em;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--cyan)}

/* ----- entry splash ----- */
.loading{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#1b2150,#05060e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .5s steps(5)}
.loading.out{opacity:0;pointer-events:none}
.loading canvas{width:120px;height:120px;image-rendering:pixelated}
.ld-title{font-size:22px;letter-spacing:.3em;color:#f4f6ff;text-shadow:2px 2px 0 var(--pink)}
.ld-bar{width:min(260px,70vw);height:12px;border:2px solid #dfe5ff;border-radius:4px;box-shadow:0 0 0 2px #14162b;background:#0a0f22;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--cyan) 0 10px,#9ff8ff 10px 12px)}
.ld-pct{font-size:13px;color:var(--cyan);letter-spacing:.2em;font-variant-numeric:tabular-nums}
.ld-tip{font-size:13px;color:var(--muted);min-height:1.5em;text-align:center}
.splash{position:fixed;inset:0;z-index:50;background:#05060e;overflow:hidden;transition:opacity .6s steps(6)}
.splash.out{opacity:0;pointer-events:none}
.splash canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.sp-ui{position:absolute;left:0;right:0;top:47%;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.sp-title{display:flex;flex-direction:column;align-items:center;gap:6px;visibility:hidden}
.sp-title.show{visibility:visible}
.sp-title .en{color:var(--cyan);letter-spacing:.45em;font-size:clamp(11px,2.6vw,15px)}
.sp-title h1{margin:0;font-weight:400;font-size:clamp(40px,11vw,80px);letter-spacing:.14em;color:#f4f6ff;text-shadow:4px 4px 0 var(--pink),-3px -3px 0 #2b6c8f}
.sp-title .sub{color:var(--muted);letter-spacing:.2em;font-size:clamp(12px,2.8vw,16px)}
.sp-title.show h1{animation:wipe .7s steps(7) both}
.sp-title.show .en,.sp-title.show .sub{animation:fadein .5s steps(5) .5s both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp-press{color:var(--ink);letter-spacing:.2em;font-size:clamp(13px,3vw,17px);animation:blink 1.1s steps(2) infinite}
.sp-choose{display:flex;flex-direction:column;align-items:center;gap:14px;animation:fadein .4s steps(4) both}
.sp-choose p{margin:0;color:var(--ink);letter-spacing:.2em;font-size:clamp(14px,3.2vw,18px)}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{font:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--edge);padding:14px 18px;width:min(200px,42vw);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 0 #070912}
.opt b{font-weight:400;font-size:clamp(16px,3.6vw,20px);letter-spacing:.2em}
.opt small{color:var(--muted);font-size:clamp(10px,2.4vw,12px);line-height:1.5}
.opt.sel,.opt:hover{border-color:var(--cyan);box-shadow:0 4px 0 #070912,0 0 16px rgba(95,243,255,.35)}

/* 學會新技能：有空槽就放進去，滿了就取代威力最低的技能（招牌技能保留） */
function beastLearn(b,id,quiet){b.known=b.known||[];if(b.known.includes(id)||b.skills.includes(id))return null;b.known.push(id);
  let i=b.skills.indexOf(null),old=null;
  if(i<0){let lo=1e9;b.skills.forEach((s,j)=>{if(!s||s.startsWith('sig_'))return;if(SKILLS[s].base<lo){lo=SKILLS[s].base;i=j}});if(i>=0&&SKILLS[b.skills[i]].base>=SKILLS[id].base)i=-1}
  if(i>=0){old=b.skills[i];b.skills[i]=id}
  return{id,old,slot:i}}
function beastCatchUp(b){const out=[];for(const [lv,id] of learnset(b.key))if(lv<=b.lv){const r=beastLearn(b,id,1);if(r)out.push(r)}return out}

function addItem(id,n=1){
  const it=ITEMS[id];
  if(it.stack){const s=G.bag.find(b=>b.id===id);if(s){s.n+=n;return true}}
  if(bagCount(bagCat(id))>=BAG_MAX)return false;
  G.bag.push({id,n});return true;
}
function removeAt(i,n=1){const s=G.bag[i];s.n-=n;if(s.n<=0)G.bag.splice(i,1)}
function bonus(){const b={hp:0,mp:0,ele:0,psy:0,mec:0,luk:0};for(const k in G.equip){const id=G.equip[k];if(id)for(const s in ITEMS[id].stats||{})b[s]=(b[s]||0)+ITEMS[id].stats[s]}return b}
function attrs(){const b=bonus(),a={};for(const k of ATTRS)a[k]=G.char.attr[k]+b[k];return a}
function calcHP(a,L,b){return 150+(L-1)*100+(a.ele-5)*20+(a.mec-5)*10+b.hp}
function calcMP(a,L,b){return 100+(L-1)*50+(a.psy-5)*20+(a.luk-5)*10+b.mp}
const maxHP=()=>calcHP(attrs(),G.char.lv,bonus()),maxMP=()=>calcMP(attrs(),G.char.lv,bonus());
function expNeed(lv){const n=Math.round(20*Math.pow(lv,1.5)+30);return G.job==='mech'?Math.round(n*1.25):n}
function beastExpNeed(lv){const n=Math.round(18*Math.pow(lv,1.5)+30);return G.job==='tech'?Math.round(n*.8):n}
/* 戰鬥勝利經驗：角色等級 cl、怪獸等級 ml */
function expMul(cl,ml){const d=ml-cl;return d>=0?Math.min(2.5,1+d*.15):Math.max(.1,1+d*.12)}
function battleExp(cl,ml){
  const base=18+ml*9,k=expMul(cl,ml);         // 對手越強經驗越多，太弱則遞減
  return Math.max(1,Math.round(base*k));
}
function gainExp(n){
  const c=G.char;if(c.lv>=99)return;c.exp+=n;let up=0;
  while(c.lv<99&&c.exp>=expNeed(c.lv)){c.exp-=expNeed(c.lv);c.lv++;c.points+=5;up++;if(G.job)for(const [k,v] of Object.entries(JOB_PROF[G.job].grow))c.attr[k]+=v}
  if(up){c.hp=null;c.mp=null}
  if(c.lv>=99)c.exp=0;
  toast('獲得經驗',`EXP +${n}`);
  if(up)setTimeout(()=>toast('升級！',`Lv.${c.lv}　獲得 ${up*5} 點能力點數${G.job?'・'+profTxt(Object.fromEntries(Object.entries(JOB_PROF[G.job].grow).map(([k,v])=>[k,v*up]))):''}`,'gold'),600);
}
/* 隱藏能力：元素力（主）＋機械力・幸運力（次）→直接攻擊力；精神力（主）＋幸運力・機械力（次）→魔法攻擊力；機械力→爆擊率；幸運力→閃避率 */
function hiddenFrom(a,L){return{atk:Math.round(-2.5+a.ele*4+a.mec*1.5+a.luk*1+(L-1)*12),mat:Math.round(-2.5+a.psy*4+a.luk*1.5+a.mec*1+(L-1)*12),crit:Math.min(50,Math.round((5+(a.mec-5)*1.5)*10)/10),eva:Math.min(40,Math.round((5+(a.luk-5)*1.2)*10)/10),def:Math.round(6+L*1.5),spd:10+L*2}}
const hidden=()=>hiddenFrom(attrs(),G.char.lv);
const isMag=sk=>sk.sys==='精神';
function beastStats(key,lv,stage=0){const d=DEX.find(x=>x.id===key),[h,m,at,df,sp]=d.st,g=1+(lv-1)*.42,ga=1+(lv-1)*.62,k=1+stage*.25;
  return{hp:Math.round((h*3+100)*g*k),mp:Math.round((m*1.5+40)*(1+(lv-1)*.3)*(1+stage*.2)),atk:Math.round((at*.6+20)*ga*k),mat:Math.round((m*.6+20)*ga*k),def:Math.round((df*.3+5)*(1+(lv-1)*.08)*k),spd:Math.round((5+sp*.5+(lv-1)*sp/25)*(1+stage*.1))}}
const bStage=b=>b.form?b.form[1]+1:0;
const GBK={hp:'HP',atk:'攻擊',mat:'魔攻',def:'防禦',spd:'速度'},GBW={hp:12,atk:3,mat:3,def:2,spd:1.5};
const bStats=b=>{const s=beastStats(b.key,b.lv,bStage(b)),g=b.gb;if(g)for(const k in GBW)s[k]+=Math.round((g[k]||0)*GBW[k]);return s};
/* 打倒的幻獸屬性決定升級配點方向 */
function growthOf(key){const d=DEX.find(x=>x.id===key);if(!d)return['hp','def'];
  const E={'火':['atk','atk'],'雷':['spd','atk'],'風':['spd','spd'],'水':['hp','mat'],'土':['def','hp'],'冰':['def','mat'],'光':['mat','mat'],'暗':['atk','spd']};
  if(d.el&&E[d.el])return E[d.el];return d.sys.includes('p')?['mat','hp']:d.sys.includes('m')?['def','hp']:['hp','atk']}
function addGrowth(b,foeKey,levels){if(!levels)return null;const g=b.gb||(b.gb={hp:0,atk:0,mat:0,def:0,spd:0}),[a,c]=growthOf(foeKey);
  g[a]+=levels*2;g[c]+=levels;const st=bStats(b);b.hp=st.hp;b.mp=st.mp;return[a,c]}
/* 技能輸出：角色的攻擊力（物理）與魔法攻擊力（精神系）都會影響，主要屬性 100%、另一項 25%；技能基礎威力再放大 */
function skillPower(id,beast){
  const sk=SKILLS[id],h=hidden(),mg=isMag(sk)||sk.eff==='heal'||sk.eff==='healall'||sk.eff==='mp';
  if(!beast)return Math.round(((mg?h.mat:h.atk)+(mg?h.atk:h.mat)*.25)*(1+sk.base/60)+sk.base);
  const s=bStats(beast);let p=((mg?s.mat:s.atk)+(mg?h.mat:h.atk)*.35+(mg?h.atk:h.mat)*.1)*(1+sk.base/60)+sk.base;
  if(G.job&&JOBS[G.job].sys===sk.sys)p*=1.3;
  return Math.round(p);
}
const beastHP=b=>bStats(b).hp,beastMP=b=>bStats(b).mp;
function pcCur(){const c=G.char,H=maxHP(),M2=maxMP();if(c.hp==null||c.hp>H)c.hp=H;if(c.mp==null||c.mp>M2)c.mp=M2;return c}
function bCur(b){const st=bStats(b);if(b.hp==null||b.hp>st.hp)b.hp=st.hp;if(b.mp==null||b.mp>st.mp)b.mp=st.mp;return b}
function healAll(){G.char.hp=maxHP();G.char.mp=maxMP();for(const b of G.beasts){const st=bStats(b);b.hp=st.hp;b.mp=st.mp}}
function beastGainExp(b,n){let up=0;b.exp+=n;while(b.lv<99&&b.exp>=beastExpNeed(b.lv)){b.exp-=beastExpNeed(b.lv);b.lv++;up++}if(b.lv>=99)b.exp=0;if(up){const st=bStats(b);b.hp=st.hp;b.mp=st.mp}return up}

function genMaze(seed,cw,chh,o,exit){
  let r=seed>>>0;const rnd=()=>{r^=r<<13;r>>>=0;r^=r>>>17;r^=r<<5;r>>>=0;return r/4294967296};
  const W2=cw*2+1,H2=chh*2+1,g=Array.from({length:H2},()=>Array(W2).fill('#'));
  const seen=Array.from({length:chh},()=>Array(cw).fill(0));
  const sx=o==='ns'?cw>>1:0,sy=o==='ns'?0:chh>>1,st=[[sx,sy]];seen[sy][sx]=1;g[sy*2+1][sx*2+1]='.';
  while(st.length){const [x,y]=st[st.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([a,b])=>a>=0&&b>=0&&a<cw&&b<chh&&!seen[b][a]);
    if(!nb.length){st.pop();continue}
    const [a,b,dx,dy]=nb[Math.floor(rnd()*nb.length)];seen[b][a]=1;g[y*2+1+dy][x*2+1+dx]='.';g[b*2+1][a*2+1]='.';st.push([a,b])}
  for(let i=0;i<cw*chh*.12;i++){const x=1+Math.floor(rnd()*(W2-2)),y=1+Math.floor(rnd()*(H2-2));if(g[y][x]==='#'&&((g[y][x-1]==='.'&&g[y][x+1]==='.')||(g[y-1][x]==='.'&&g[y+1][x]==='.')))g[y][x]='.'}
  const ent=o==='ns'?[sx*2+1,0]:[0,sy*2+1],ex=o==='ns'?[(cw>>1)*2+1,H2-1]:[W2-1,(chh>>1)*2+1];
  g[ent[1]][ent[0]]='.';if(exit)g[ex[1]][ex[0]]='.';
  const D2=Array.from({length:H2},()=>Array(W2).fill(-1)),q=[ent];D2[ent[1]][ent[0]]=0;
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<W2&&b<H2&&g[b][a]!=='#'&&D2[b][a]<0){D2[b][a]=D2[y][x]+1;q.push([a,b])}}}
  let lm=null,best=-1;for(let y=1;y<H2-1;y+=2)for(let x=1;x<W2-1;x+=2){const nbr=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]!=='#').length;
    const far=Math.abs(x-ex[0])+Math.abs(y-ex[1]);if(nbr===1&&D2[y][x]>best&&(!exit||far>6)){best=D2[y][x];lm=[x,y]}}
  g[lm[1]][lm[0]]='X';
  const near=(x,y,p)=>Math.abs(x-p[0])+Math.abs(y-p[1])<3;
  for(let y=0;y<H2;y++)for(let x=0;x<W2;x++)if(g[y][x]==='.'&&!near(x,y,ent)&&!near(x,y,ex)&&!near(x,y,lm)&&(hash(x+seed,y*7)%100)<40)g[y][x]='G';
  return{rows:g.map(r=>r.join('')),ent,ex,lm};
}

function genTown(sp){

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(isl?(x<2||y<2||x>=W-2||y>=H-2):(x===0||y===0||x===W-1||y===H-1))g[y][x]=isl?'w':'T'}
  if(sp.dock&&!isl)for(let y=H-3;y<H;y++)for(let x=1;x<W-1;x++)g[y][x]='w';
  const lo=isl?2:1,hiX=isl?W-3:W-2,hiY=sp.dock?H-4:(isl?H-3:H-2);
  for(let x=lo;x<=hiX;x++)g[my][x]='.';for(let y=lo;y<=hiY;y++)g[y][mx]='.';
  const ex={};
  if(sp.exits.W){g[my][0]='.';if(isl)g[my][1]='.';ex.W=[0,my]}
  if(sp.exits.E){g[my][W-1]='.';if(isl)g[my][W-2]='.';ex.E=[W-1,my]}
  if(sp.exits.N){g[0][mx]='.';if(isl)g[1][mx]='.';ex.N=[mx,0]}
  if(sp.exits.S){g[H-1][mx]='.';if(isl)g[H-2][mx]='.';ex.S=[mx,H-1]}
  if(sp.dock)for(let y=hiY+1;y<H;y++)g[y][mx]='b';
  const blds=[],slots=[[2,2],[8,2],[17,2],[23,2],[2,11],[8,11],[17,11],[23,11]];
  const kinds=['heal','house','shop','house','house','house','house','house'];
  if(sp.lm)for(let y=10;y<=13;y++)for(let x=8;x<=12;x++)g[y][x]='Z';
  slots.forEach(([x,y],i)=>{if(sp.lm&&i===5)return;if(kinds[i]==='house'&&rnd()<.25)return;

  for(let y=lo;y<=hiY;y++)for(let x=lo;x<=hiX;x++)if(g[y][x]==='g'){const v=rnd();
    const nearPath=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>'.ckob'.includes((g[y+b]||[])[x+a]));

}

function others(a){return [player,...MAP.actors].filter(o=>o!==a&&!o.hidden)}
function free(a,x,y){
  const ch=tileAt(MAP,x,y);
  if(x<0||y<0||x>=MAP.w||y>=MAP.h)return false;
  if(MAP.solid.includes(ch)&&!(a===player&&SURF!=null&&ch==='w'))return false;
  if(a.wander){const b=a.wander.box;if(!a.wander.chars.includes(ch)||x<b[0]||x>b[2]||y<b[1]||y>b[3])return false}
  return !others(a).some(o=>(o.x===x&&o.y===y)||(o.moving&&o.fx===x&&o.fy===y));
}
function startMove(a,d,force){
  a.dir=d;const nx=a.x+DV[d][0],ny=a.y+DV[d][1];
  if(!force&&!free(a,nx,ny))return false;
  if(a===player)a.speed=mountBeast()?4.4*4:4.4;
  a.fx=a.x;a.fy=a.y;a.x=nx;a.y=ny;a.t=0;a.moving=true;return true;
}
function moveSteps(a,dirs){return new Promise(r=>{a.queue=dirs.slice();a.done=r})}
function face(a,b){const dx=b.x-a.x,dy=b.y-a.y;a.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
function stepActor(a,dt){
  if(!a.moving&&a.queue.length)startMove(a,a.queue.shift(),true);
  else if(!a.moving&&!a.queue.length&&a.done){const r=a.done;a.done=null;r()}
  if(a.wander&&mode==='play'&&!a.moving&&!a.queue.length){
    a.wt-=dt;

/* 傷害：閃避（幸運力）→ 威力×60/(60+防禦) → 爆擊（機械力）×1.5 → 防禦姿勢 ×0.5 */
function hit(att,def,power,mag){
  if(Math.random()*100<def.eva)return{miss:true};
  const d=mag?def.def*.7:def.def;let dmg=power*60/(60+d)*(.9+Math.random()*.2);
  const crit=Math.random()*100<att.crit;if(crit)dmg*=1.5;if(def.guard)dmg*=.5;
  return{dmg:Math.max(1,Math.round(dmg)),crit};
}

function condMet(b,cond){
  return cond.replace(/（.*?）/g,'').split('並').every(p=>{
    let m;
    if((m=p.match(/戰鬥勝利 (\d+) 次/)))return (b.wins||0)>=+m[1];
    if(/親密度/.test(p))return (b.aff||0)>=100;
    if((m=p.match(/(?:吃下|鑲嵌)(.+?)(?: ×(\d+))?$/))){const n=+(m[2]||1);return m[1].split('與').every(nm=>((b.fed||{})[nm.trim()]||0)>=n)}
    if(/學會/.test(p))return (b.wins||0)>=10;
    if(/觸摸轉職水晶/.test(p))return false;
    return true;
  });
}
function nextStages(b){
  const ev=EVO[b.key]||[];
  if(b.form){const [bi,si]=b.form,st=ev[bi]&&ev[bi].s[si+1];return st?[{bi,si:si+1,st}]:[]}
  return ev.map((br,bi)=>({br,bi,si:0,st:br.s[0]})).filter(x=>brVisible(b.key,x.br));
}
const evoKnown=(b,x)=>{const br=EVO[b.key][x.bi];return br.hidden?brVisible(b.key,br):G.evo.includes(dexCat(DEX.find(d=>d.id===b.key)))};
const evoChoices=b=>nextStages(b).filter(x=>b.lv>=x.st[1]&&condMet(b,x.st[2])&&evoKnown(b,x));
const evoEligible=b=>nextStages(b).filter(x=>b.lv>=x.st[1]&&condMet(b,x.st[2]));
const readyStage=b=>{const c=evoEligible(b);return c.length===1?c[0]:null};
function growthHtml(b){
  const cat=dexCat(DEX.find(x=>x.id===b.key)),nx=nextStages(b);
  const fed=Object.entries(b.fed||{}).map(([k,v])=>`${k}×${v}`).join('、')||'無';
  if(!nx.length)return `<span class="k">成長紀錄：吃下／鑲嵌 ${fed}</span><span class="up">已是最終型態</span>`;
  if(!G.evo.includes(cat))return `<span class="k">成長紀錄：吃下／鑲嵌 ${fed}</span><span class="none">進化條件：到${libOf(cat).name}查閱後顯示</span>`;
  return `<span class="k">成長紀錄：吃下／鑲嵌 ${fed}</span><span class="k">下一階段進化</span>`+nx.map(x=>{const ok=b.lv>=x.st[1]&&condMet(b,x.st[2]);
    return `<div class="stat"><span>${x.st[0]} <span class="k">${EVO[b.key][x.bi].r}</span></span><span class="${ok?'up':'k'}">Lv.${x.st[1]}・${x.st[2]}${ok?' ✓':''}</span></div>`}).join('');
}

const silCache={};

function waitEv(at){return new Promise(r=>{const tick=()=>{if(!EV||EV.cancel||EV.t>=at)r();else setTimeout(tick,30)};tick()})}
async function playEvolution(from,to,preview){

  px(0,0,W,H,'#07080f');

const DROPS={};
const dropOK=id=>{const m=MAPS[id];return !!m&&(m.maze||m.gen||['town','avenue','plaza','village','port'].includes(id))};
function spawnDrops(id){if(!dropOK(id))return;const m=MAPS[id],cur=DROPS[id]||(DROPS[id]=[]),want=m.maze?3:2;
  for(let k=0;k<20&&cur.length<want;k++){if(Math.random()<.45)break;const x=1+Math.floor(Math.random()*(m.w-2)),y=1+Math.floor(Math.random()*(m.h-2)),c=m.rows[y][x];
    if(!'.gGFbs'.includes(c)||(m.solid||'').includes(c)||cur.some(d=>d.x===x&&d.y===y)||m.actors.some(a=>a.x===x&&a.y===y))continue;
    const r=Math.random();cur.push({x,y,kind:r<.45?'coin':r<.65?'potion':r<.75?'battery':r<.83?'net':'mat'})}}
function drawDrops(t){if(!dropOK(MAP.id))return;if(!DROPS[MAP.id])spawnDrops(MAP.id);
  for(const d of DROPS[MAP.id]){const X=d.x*16,Y=d.y*16+Math.round(Math.sin(t*3+d.x)*1.5);
    if(d.kind==='coin'){circ(X+8,Y+10,4,'#c08820');circ(X+8,Y+10,3,'#ffd84a');px(X+7,Y+8,1,3,'#fff3a0')}
    else{px(X+4,Y+7,8,7,d.kind==='potion'?'#ff5fa2':d.kind==='battery'?'#5ff3ff':d.kind==='net'?'#e9ecff':'#7ee08a');px(X+5,Y+8,2,2,'#ffffff');px(X+4,Y+7,8,1,'#ffffff')}
    const g=Math.max(0,Math.sin(t*4+d.y));ctx.globalAlpha=g;px(X+12,Y+4,1,3,'#ffffff');px(X+11,Y+5,3,1,'#ffffff');ctx.globalAlpha=1}}
function pickDrop(){const L=DROPS[MAP.id];if(!L)return;const i=L.findIndex(d=>d.x===player.x&&d.y===player.y);if(i<0)return;const d=L.splice(i,1)[0];
  const lv=MAP.lv?MAP.lv[0]:5;
  if(d.kind==='coin'){const v=10+Math.floor(Math.random()*40)+lv*5;G.money=(G.money||0)+v;toast('撿到了',`${v} 晶幣`,'gold');return}
  if(d.kind==='mat'){const mats=MATS.filter(m=>m[3]===1),m=mats[Math.random()*mats.length|0];if(addItem(MAT_ID[m[0]]))toast('撿到了',m[0]);else toast('背包滿了','撿不起來');return}
  if(addItem(d.kind))toast('撿到了',ITEMS[d.kind].name);else toast('背包滿了','撿不起來');}

const ISLES={coral:{name:'珊瑚島',fee:1500,how:'白沙鎮的漁夫'},volcano:{name:'火山島',fee:2500,how:'風車鎮的工程師'},star:{name:'星辰島',fee:4000,how:'雪原鎮的占星師'}};
const isleOpen=k=>!!G.flags['isl_'+k];
async function taskQuest(name,key,o){
  const st=qv(key);
  if(st===2)return say([name,o.after]);
  if(st===0){await say(...o.intro.map(x=>[name,x]));const k=await ask(name,o.ask,['接下委託','下次吧']);if(k!==0)return say([name,'有空再來找我吧。']);G.q[key]=1;if(o.start)o.start();refreshHUD();toast('新委託',o.title);return say([name,o.hint])}
  if(!o.done())return say([name,o.prog()]);
  if(o.pay)o.pay();G.q[key]=2;o.give();await say(...o.thanks.map(x=>[name,x]));refreshHUD();
}
async function boatman(here){
  const N='船夫';await say([N,'要出海嗎？風浪不小，抓好欄杆喔！']);
  const dests=[];if(here!=='port')dests.push(['port','港灣鎮']);if(here!=='sand')dests.push(['sand','白沙鎮']);
  for(const k in ISLES)if(k!==here)dests.push([k,ISLES[k].name+(isleOpen(k)?'':'（未開放）')]);
  const i=await ask(N,'要去哪裡？',[...dests.map(d=>d[1]),'不搭了']);if(i>=dests.length)return say([N,'下次見！']);
  const [to]=dests[i];
  if(ISLES[to]&&!isleOpen(to)){const I=ISLES[to];
    await say([N,`往${I.name}的航線很危險，要嘛付 ${I.fee} 晶幣的船資，要嘛拿船票來。`],[N,`聽說${I.how}手上有船票，幫他一個忙或許能拿到。`]);
    const k=await ask(N,`要付 ${I.fee} 晶幣嗎？（持有 ${G.money||0}）`,['付錢出航','算了']);if(k!==0)return say([N,'想好了再來吧。']);
    if((G.money||0)<I.fee)return say([N,'晶幣不夠喔。']);G.money-=I.fee;G.flags['isl_'+to]=true;toast('新航線',`${I.name}航線開通`,'gold')}
  await say('船夫解開纜繩，船慢慢駛離碼頭……','……海浪拍打著船身……','……遠方的島影越來越清楚了。');
  if(to==='port')travel('port',12,12,'up');else{const m=MAPS[to];travel(to,m.townEx?14:14,m.h-2,'up')}

function ask(name,text,opts){return new Promise(res=>{D={lines:[[name,text]],i:0,shown:0,full:'',resolve:()=>{},ask:{opts,sel:0,res}};openLine();renderAsk()})}
function renderAsk(){const el=$('#dlgOpts');if(!D||!D.ask){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;el.innerHTML=D.ask.opts.map((o,i)=>`<button class="aopt${i===D.ask.sel?' on':''}" data-ao="${i}">${esc(fmt(o))}</button>`).join('')}
function askMove(d){if(!D||!D.ask)return;const n=D.ask.opts.length;if(d==='up')D.ask.sel=(D.ask.sel+n-1)%n;else if(d==='down')D.ask.sel=(D.ask.sel+1)%n;renderAsk()}
function askPick(i){const a=D.ask;D.shown=D.full.length;dlg.hidden=true;$('#dlgOpts').hidden=true;D=null;a.res(i)}
$('#dlgOpts').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-ao]');if(!b||!D||!D.ask)return;e.preventDefault();e.stopPropagation();askPick(+b.dataset.ao)});
function say(...lines){return new Promise(res=>{D={lines,i:0,shown:0,full:'',resolve:res};openLine()})}
function openLine(){
  const l=D.lines[D.i];let name='',text=l;if(Array.isArray(l))[name,text]=l;
  D.full=fmt(text);D.shown=0;dlgName.textContent=fmt(name);dlgName.hidden=!name;dlgText.textContent='';
  dlg.classList.toggle('narr',!name);dlg.hidden=false;
}
function advance(){
  if(D.shown<D.full.length){D.shown=D.full.length;dlgText.textContent=D.full;return}
  if(D.ask){askPick(D.ask.sel);return}
  D.i++;if(D.i>=D.lines.length){dlg.hidden=true;const r=D.resolve;D=null;r()}else openLine();
}
function toast(label,text,kind){
  const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');
  const s=document.createElement('small');s.textContent=label;el.append(s,text);
  $('#toastHost').append(el);setTimeout(()=>el.remove(),2900);
}

function jobKey(k){

  if(k==='up'||k==='left')JS.sel=(JS.sel+3)%4;else if(k==='down'||k==='right')JS.sel=(JS.sel+1)%4;else if(k==='A')JS.confirm=true;

}

async function interact(){
  const [dx,dy]=DV[player.dir],tx=player.x+dx,ty=player.y+dy;
  let npc=MAP.actors.find(a=>!a.hidden&&a.x===tx&&a.y===ty);
  if(!npc&&tileAt(MAP,tx,ty)==='R')npc=MAP.actors.find(a=>!a.hidden&&a.x===tx+dx&&a.y===ty+dy);
  mode='busy';
  if(npc){face(npc,player);await npc.talk()}
  else{
    const ch=tileAt(MAP,tx,ty);
    if(ch==='w'&&!MAP.maze&&MAP.id!=='lab'&&G.flags.seachild&&SURF==null&&await seaCall(tx,ty)){if(mode==='busy')mode='play';return}
    if(MAP.id==='library'&&ch==='B')await readShelf(SHELF[tx]);
    else if(MAP.id==='lab'&&ch==='P')await podLook(tx,ty);
    else if(MAP.id==='lab'&&ch==='X')await crystalScene();
    else if(MAP.id==='plaza'&&ch==='E'&&G.flags.metDoc){await goLab();return}
    else if(MAP.maze&&ch==='X')await landmark();
    else if(ch==='y'&&(MAP.id==='plaza'||MAP.id==='village'||MAP.id==='port')){await enterRoom('guild',tx,ty);return}
    else if((MAP.id==='plaza'||MAP.id==='village'||MAP.id==='port'||MAP.gen)&&ch==='c'){await enterRoom('clinic',tx,ty);return}
    else if((MAP.gen||MAP.id==='village'||MAP.id==='port')&&ch==='o'){await enterRoom('shop',tx,ty);return}
    else if(MAP.id==='port'&&ch==='u')await warehouse();
    else if(MAP.id==='port'&&ch==='O')await lighthouse();
    else if((MAP.id==='village'||MAP.id==='port'||MAP.gen)&&(ch==='k'||ch==='K'||ch==='J'))await say('居民的房子。門鎖著。');
    else if(MAP.id==='plaza'&&ch==='o'){await enterRoom('shop',tx,ty);return}
    else if(MAP.id==='plaza'&&ch==='q'){await enterRoom('breed',tx,ty);return}
    else if(MAP.id==='plaza'&&ch==='W'&&(G.q.glasses||0)===1){await say('噴泉旁的石縫裡有東西在發亮……','找到了「老花眼鏡」！');addItem('glasses');G.q.glasses=2}
    else if(MAP.id==='home'&&(ch==='B'||ch==='b')&&G.beasts.length){healAll();await say('你在床上小睡了一下……','主角和夥伴的 HP、MP 全部恢復了！')}
    else if(MAP.id==='home'&&ch==='T'){
      if(!G.flags.cake){await say('桌上有媽媽做的早餐和一張紙條：「生日快樂」。');if(addItem('cake')){G.flags.cake=true;await say('獲得「生日蛋糕」！')}else await say('背包滿了，拿不下。')}
      else await say('桌上只剩下媽媽的紙條了。');
    }else{
      const msg=SIGNS[tx+','+ty]||TEXT[MAP.id][ch];
      if(msg)await say(...[].concat(msg));
      const LT=({home:{S:['core','elem','mech','psy','fusion'],'~':['vehicle'],M:['holo']},town:{Y:['barrier']},lab:{Q:['core'],H:['barrier'],b:['resonance'],M:['mech'],w:['barrier']},avenue:{},plaza:{},library:{K:['evorule']}}[MAP.id]||{})[ch];
      if(LT)unlock(...LT);
    }
    if(MAP.id==='home'&&'~SMBbTCp'.includes(ch)){const k=ch==='b'?'B':ch;if(!G.looked.includes(k)){G.looked.push(k);checkSide('tour')}}
  }
  if(mode==='busy')mode='play';
}

function onArrive(){

  else if(id==='port'&&x===0&&player.y===7)enterMaze('canyon',-1,'ex');
  else if(id==='plaza'&&player.y===MAP.h-1)enterMaze('swamp',1,'ent');
  else if(id==='village'&&x===MAP.w-1&&player.y===8)enterMaze('r_flower',1,'ent');
  else if(id==='port'&&x===MAP.w-1&&player.y===7)enterMaze('r_coast',1,'ent');
  else if(id==='town'&&x===0&&player.y===7)enterMaze('r_west',-1,'ex');
  else if(MAP.townEx&&townExit()){}
  else if(MAP.maze&&mzAt('ent'))mazeBack();
  else if(MAP.maze&&mzAt('ex'))mazeFwd();
  else if(MAP.maze&&ch==='G'&&G.beasts.length&&tryEncounter(MAP.pool,MAP.lv)){}
  else if(SURF!=null&&ch==='w'&&G.beasts.length&&tryEncounter(SEA_POOL,SEA_LV[MAP.id]||[30,36])){}
  else if(MAP.room&&ch==='D')leaveRoom();
  else if(id==='lab'&&ch==='D')leaveLab();
  else if(id==='town'&&ch==='v')enterLibrary('town');
  else if(id==='plaza'&&ch==='v')enterLibrary('city');
  else if(id==='library'&&ch==='D')leaveLibrary();
  else if(id==='plaza'&&G.flags.metMom&&!G.flags.metDoc&&Math.abs(player.x-doc.x)+Math.abs(player.y-doc.y)<=2)labScene();
  else if(id==='town'&&ch==='G'&&G.beasts.length&&tryEncounter()){}
  else if(menuPending){menuPending=false;openMenu()}
}

async function toggleAuto(){
  if(autoOn)return setAuto(false,'已手動停止');
  if(!G.flags.done||!G.beasts.length)return toast('自動打怪','轉職並擁有幻獸後才能使用');
  if(!hasGrass())return toast('自動打怪','這張地圖沒有野生幻獸出沒的草叢');
  if(mode!=='play'||D)return;
  const C=G.autoCfg||(G.autoCfg={hp:40,tent:false,star:0,max:3}),HPS=[0,30,40,50,70],STARS=[0,1,2,3,4,5],MAXS=[1,3,5,10];if(C.star==null)C.star=0;if(!C.max)C.max=3;mode='busy';held.length=0;
  const nets=()=>bagN('net')+bagN('net2')+bagN('net3');
  while(true){
    const k=await ask('自動打怪設定',`回復藥 ${hpMeds()}・原地帳篷 ${bagN('tent')}・捕獸網 ${nets()}`,['開始掛機',`吃血包時機：${C.hp?'HP 低於 '+C.hp+'%':'不吃血包'}`,`HP 不足時用原地帳篷：${C.tent?'開啟':'關閉'}（持有 ${bagN('tent')}）`,`自動捕捉：${C.star?'★'.repeat(C.star)+' 以上的幻獸':'關閉'}`,`最多捕捉：${C.max} 隻後停止捕捉`,`視窗縮小時：${bgPref==='run'?'背景繼續執行':'暫停遊戲'}`,'取消']);
    if(k===1){C.hp=HPS[(HPS.indexOf(C.hp)+1)%HPS.length];continue}
    if(k===2){C.tent=!C.tent;continue}
    if(k===3){C.star=STARS[(STARS.indexOf(C.star)+1)%STARS.length];continue}
    if(k===4){C.max=MAXS[(MAXS.indexOf(C.max)+1)%MAXS.length];continue}

    mode='play';if(k===0){autoCaught=0;setAuto(true,`血包：${C.hp?'HP<'+C.hp+'%':'關'}・帳篷：${C.tent?'開':'關'}・捕捉：${C.star?'★'+C.star+'+ 最多'+C.max+'隻':'關'}`)}return}
}
function autoWalkable(x,y){if(x<=0||y<=0||x>=MAP.w-1||y>=MAP.h-1)return false;const c=tileAt(MAP,x,y);return !!c&&(c==='G'||c==='.')}
function autoStep(){
  const occ=new Set(MAP.actors.filter(a=>!a.hidden).flatMap(a=>[a.x+','+a.y,(a.moving?a.fx+','+a.fy:'')]));
  const ok=(x,y)=>autoWalkable(x,y)&&!occ.has(x+','+y);
  const dirs=['up','down','left','right'].sort(()=>Math.random()-.5);
  for(const d of dirs){const x=player.x+DV[d][0],y=player.y+DV[d][1];if(tileAt(MAP,x,y)==='G'&&ok(x,y)&&startMove(player,d)){autoBlock=0;return true}}
  if(autoBlock>12){autoBlock=0;for(const d of dirs){const x=player.x+DV[d][0],y=player.y+DV[d][1];if(ok(x,y)&&startMove(player,d))return true}}
  for(const avoid of [true,false]){
    const seen=new Set([player.x+','+player.y]),q=[[player.x,player.y,null]];
    while(q.length){const [x,y,f]=q.shift();for(const d of ['up','down','left','right']){const a=x+DV[d][0],b=y+DV[d][1],k=a+','+b;if(seen.has(k)||!(avoid?ok(a,b):autoWalkable(a,b)))continue;seen.add(k);const fd=f||d;
      if(tileAt(MAP,a,b)==='G'){if(startMove(player,fd))autoBlock=0;else{player.dir=fd;autoBlock++}return true}q.push([a,b,fd])}}}
  return false;
}
function autoHeal(){
  const C=G.autoCfg||{hp:40,tent:false},b=G.beasts[0];pcCur();bCur(b);const st=bStats(b),pr=G.char.hp/maxHP(),br=b.hp/st.hp,low=Math.min(pr,br),thr=C.hp/100;
  const miss=pr<br?maxHP()-G.char.hp:st.hp-b.hp,hm=Object.keys(HEAL).filter(k=>HEAL[k].hp&&!HEAL[k].all&&bagN(k)>0).sort((x,y)=>HEAL[x].hp-HEAL[y].hp),pk=hm.find(k=>HEAL[k].hp>=miss*.7)||hm[hm.length-1];
  const i=pk?G.bag.findIndex(x=>x.id===pk):-1;
  if(thr>0&&low<thr&&i>=0){removeAt(i);const v=HEAL[pk].hp;if(pr<br)G.char.hp=Math.min(maxHP(),G.char.hp+v);else b.hp=Math.min(st.hp,b.hp+v);toast('自動打怪','使用了'+ITEMS[pk].name);return true}
  if(low<Math.max(thr,.3)){
    if(C.tent){
      const ti=G.bag.findIndex(x=>x.id==='tent');if(ti<0){setAuto(false,'沒有「原地帳篷」了（寄信給遊戲設計者索取或提出想法，就能拿到兌換碼，到角色欄兌換）');return false}
      healAll();toast('原地帳篷','搭起帳篷休息，全員完全回復！','gold');return true}
    if(low<.2||(thr>0&&i<0)){setAuto(false,'HP 太低又沒有回復手段，請回救護中心休息');return false}
  }
  return true;
}
function autoTick(dt){
  if(!autoOn)return;autoT-=dt;if(autoT>0)return;autoT=.1;
  if(mode==='evolve'){evoKey('A');return}
  if(mode==='battle'&&BT){
    if(BT.wait){battleKey('A');return}
    const m=BT.menu;if(!m)return;
    const wc=autoWantCatch();
    if(wc&&m.lv==='main'){const u=BT.unit,foe=BT.foe;
      if(u.kind!=='pc'){m.sel=m.opts.findIndex(o=>o.v==='guard');battleKey('A');return}
      if(foe.hp>foe.max*.3&&G.skills.slots.includes('mercy')&&u.mp>=SKILLS.mercy.mp){autoMercy=1;m.sel=m.opts.findIndex(o=>o.v==='skill');battleKey('A');return}
      m.sel=m.opts.findIndex(o=>o.v==='item');battleKey('A');return}
    if(m.lv==='item'){const best=['net3','net2','net'].map(id=>m.opts.findIndex(o=>o.v===id)).find(i=>i>=0);if(wc&&best!=null){m.sel=best;battleKey('A');return}battleKey('B');return}
    if(m.lv==='skill'&&autoMercy){autoMercy=0;const i=m.opts.findIndex(o=>o.v==='mercy');if(i>=0&&!m.opts[i].dis){m.sel=i;battleKey('A');return}battleKey('B');return}
    if(m.lv==='main'){const u=BT.unit,ids=(u.kind==='pc'?G.skills.slots:u.ref.skills).filter(id=>id&&!SKILLS[id].eff&&u.mp>=SKILLS[id].mp+10);
      if(ids.length&&Math.random()<.6){m.sel=m.opts.findIndex(o=>o.v==='skill');battleKey('A');return}
      m.sel=0;battleKey('A');return}
    if(m.lv==='skill'){let best=-1,bp=-1;m.opts.forEach((o,i)=>{if(o.dis||SKILLS[o.v].eff)return;const p=skillPower(o.v,BT.unit.kind==='pc'?null:BT.unit.ref);if(p>bp){bp=p;best=i}});if(best<0){battleKey('B');return}m.sel=best;battleKey('A');return}
    battleKey('B');return}
  if(D){if(D.ask){setAuto(false,'遇到需要選擇的對話');return}advance();return}
  if(waitA){pressA();return}
  if(mode!=='play'){if(mode==='svc'||mode==='menu'||mode==='job')setAuto(false);return}
  if(player.moving||player.queue.length)return;
  if(!hasGrass()){setAuto(false,'這張地圖沒有草叢');return}
  if(bagCount(0)>=BAG_MAX){setAuto(false,'消耗品背包滿了');return}
  if(!autoHeal())return;
  if(!autoStep())setAuto(false,'找不到可以走的草叢');
}

let cloud=null,lastSave=null;
async function initStore(){
  for(let i=0;i<8&&!(window.claude&&window.claude.use);i++)await pause(250);

    if(window.claude&&window.claude.use){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const id=user?await user.id():null;
      if(db&&id)cloud=db.doc('data/users/'+id+'/save');
    }
  }catch(e){cloud=null}
  lastSave=await readSave();
  $('#contBtn').disabled=!lastSave;
  $('#contInfo').textContent=lastSave?`上次存檔：${lastSave.hero}・${lastSave.where}・${fmtTime(lastSave.G.time)}`:'還沒有存檔';
  if(M.open)renderMenu();

async function readSave(){
  let a=null,b=null;
  if(cloud){try{const s=await cloud.get();if(s.exists)a=JSON.parse(s.data().json)}catch(e){}}
  try{const j=localStorage.getItem('cbe-save-v1');if(j)b=JSON.parse(j)}catch(e){}
  if(a&&b)return a.savedAt>=b.savedAt?a:b;return a||b;
}
async function writeSave(obj){
  let ok=null;const json=JSON.stringify(obj);
  try{localStorage.setItem('cbe-save-v1',json);ok='local'}catch(e){}
  if(cloud){try{await cloud.set({json,at:obj.savedAt});ok='cloud'}catch(e){}}
  return ok;
}

  SW=192;SH=Math.max(120,Math.round(SW*innerHeight/Math.max(1,innerWidth)));

  parts=[];

    const a=Math.random()*Math.PI*2,r=Math.max(SW,SH)*(.6+Math.random()*.4);

  for(const p of parts){
    const k=Math.max(0,Math.min(1,(spT-p.d)/.9));if(k<=0)continue;
    const e=1-Math.pow(1-k,3);sp1(p.sx+(p.tx-p.sx)*e,p.sy+(p.ty-p.sy)*e,1,1,p.col);
  }
  if(done){
    const rt=spT-1.7;
    if(rt<1.4){sx.globalAlpha=Math.max(0,1-rt/1.4);const r=ds+rt*70;for(let a=0;a<96;a++){const an=a/96*Math.PI*2;sp1(cx0+Math.cos(an)*r,cy0+Math.sin(an)*r*.9,1,1,'#5ff3ff')}sx.globalAlpha=1}
    for(let i=0;i<3;i++){const an=spT*1.6+i*2.094;sp1(cx0+Math.cos(an)*(ds+10),cy0+Math.sin(an)*(ds+4)*.6,2,2,i?'#5ff3ff':'#ffd166')}
    if(rt<.35){sx.globalAlpha=(1-rt/.35)*.6;sp1(0,0,SW,SH,'#ffffff');sx.globalAlpha=1}
  }
  const gy=SH-Math.round(SH*.08);sp1(0,gy,SW,1,'#2a3366');
  for(let i=0;i<SW;i+=12)sp1((i+spT*20)%SW,gy+3,4,1,'#1a2149');
}
function spStep(now){
  if(!splashOn)return;
  if(!loadDone){spLast=now;requestAnimationFrame(spStep);return}
  const dt=Math.min(.05,(now-spLast)/1000);spLast=now;spT+=dt;
  if(spStage==='anim'){
    if(spT>1.9)$('#spTitle').classList.add('show');
    if(spT>2.8){spStage='press';$('#spPress').hidden=false}
  }
  spDraw();requestAnimationFrame(spStep);
}
function spSkip(){spT=Math.max(spT,3);$('#spTitle').classList.add('show');spStage='press';$('#spPress').hidden=false}
function spChoose(){
  spStage='choose';$('#spPress').hidden=true;$('#spChoose').hidden=false;
  optSel=layout==='pc'?0:1;spMark();
}
function spMark(){document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===optSel))}
function spAdvance(){if(spStage==='anim')spSkip();else if(spStage==='press')spChoose()}
function spPick(l){
  setLayout(l);splashOn=false;spl.classList.add('out');
  setTimeout(()=>{spl.hidden=true;$('#startBtn').focus()},650);
}
function splashKey(e){
  if(!loadDone){e.preventDefault();return}
  if(['Tab','Shift','Control','Alt','Meta'].includes(e.key))return;
  e.preventDefault();if(e.repeat)return;
  if(spStage!=='choose'){spAdvance();return}
  if(['ArrowLeft','ArrowUp','a','A','w','W'].includes(e.key)){optSel=0;spMark()}
  else if(['ArrowRight','ArrowDown','d','D','s','S'].includes(e.key)){optSel=1;spMark()}
  else if(e.key==='1')spPick('pc');else if(e.key==='2')spPick('mobile');
  else if(['Enter',' ','z','Z'].includes(e.key))spPick(optSel===0?'pc':'mobile');
}
spl.addEventListener('pointerdown',e=>{if(!loadDone)return;if(spStage!=='choose'){e.preventDefault();spAdvance()}});
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>spPick(b.dataset.layout)));
$('#spRec').textContent=coarse?'手機':'電腦';
addEventListener('resize',()=>{if(splashOn)spSetup()});
spSetup();if(reduce)spSkip();requestAnimationFrame(spStep);

/* ================= loading ================= */
var loadDone=false;
(()=>{
  const ld=$('#loading'),lc=$('#ldc'),lg=lc.getContext('2d'),bar=$('#ldBar'),pct=$('#ldPct'),tip=$('#ldTip');
  const TIPS=['正在喚醒轉職水晶……','正在描繪 40 種基礎幻獸……','正在計算 128 種進化型態……','正在整理圖書館的藏書……','提示：在家裡的床上休息，可以恢復 HP 和 MP','提示：餵素材給夥伴，可以累積進化條件','提示：打開選單的「圖鑑」，能預覽進化動畫'];
  const tasks=[];
  DEX.forEach(d=>tasks.push(()=>dexURL(d)));
  DEX.forEach(d=>(EVO[d.id]||[]).forEach((br,bi)=>br.s.forEach((x,si)=>tasks.push(()=>dexURL(formObj(d,bi,si))))));
  Object.keys(ITEMS).forEach(id=>tasks.push(()=>iconURL(id)));
  let fontOK=false;try{(document.fonts?document.fonts.load('16px "DotGothic16"'):Promise.resolve()).then(()=>fontOK=true,()=>fontOK=true)}catch(e){fontOK=true}
  setTimeout(()=>fontOK=true,2500);
  const t0=performance.now();let i=0,shown=0,tipT=0,tipI=0;
  function crystal(t){
    lg.clearRect(0,0,48,48);
    const w=Math.max(1,Math.abs(Math.cos(t*2))*12),cx=24,cy=22,h=16;
    lg.globalAlpha=.25+.15*Math.sin(t*4);lg.fillStyle='#ff5fa2';for(let y=-h-4;y<=h+4;y++){const ww=(1-Math.abs(y)/(h+4))*(w+5);lg.fillRect(Math.round(cx-ww),cy+y,Math.round(ww*2)||1,1)}
    lg.globalAlpha=1;
    for(let y=-h;y<=h;y++){const ww=(1-Math.abs(y)/h)*w;lg.fillStyle=y<0?(Math.cos(t*2)>0?'#ffc2dc':'#ff8fc0'):(Math.cos(t*2)>0?'#ff5fa2':'#d43c85');lg.fillRect(Math.round(cx-ww),cy+y,Math.max(1,Math.round(ww*2)),1);lg.fillStyle='#5ff3ff';lg.fillRect(Math.round(cx-ww),cy+y,1,1);lg.fillRect(Math.round(cx+ww)-1,cy+y,1,1)}
    for(let k=0;k<3;k++){const an=t*2.2+k*2.094;lg.fillStyle=k?'#5ff3ff':'#ffd166';lg.fillRect(Math.round(cx+Math.cos(an)*19),Math.round(cy+Math.sin(an)*7),2,2)}
    lg.globalAlpha=.4;lg.fillStyle='#5ff3ff';lg.fillRect(14,44,20,1);lg.globalAlpha=1;
  }
  function step(now){
    const t=(now-t0)/1000,start=performance.now();
    while(i<tasks.length&&performance.now()-start<8){try{tasks[i]()}catch(e){}i++}
    const real=(i/tasks.length)*(fontOK?1:.95),target=Math.min(real,t/1.6);
    shown+=(target-shown)*.25;if(target>=1&&shown>.995)shown=1;
    bar.style.width=(shown*100).toFixed(1)+'%';pct.textContent=Math.round(shown*100)+'%';
    if(t-tipT>1.1){tipT=t;tip.textContent=TIPS[Math.min(TIPS.length-1,tipI++)]}
    crystal(t);
    if(shown>=1&&i>=tasks.length&&fontOK){tip.textContent='載入完成！';setTimeout(()=>{ld.classList.add('out');loadDone=true;spLast=performance.now();setTimeout(()=>ld.hidden=true,550)},350);return}
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
})();
</script>
